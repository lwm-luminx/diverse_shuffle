name: Release

# Publishes DiverseShuffle::Engine::VERSION to RubyGems: push a tag vX.Y.Z on main, or run this workflow by hand on
# main (it tags the commit itself). It builds a precompiled gem per platform (no Rust toolchain needed to install
# those) plus the source gem, which compiles the extension where Rust is installed and otherwise falls back to the
# Ruby engine at run time. Publishing uses RubyGems trusted publishing, so no API key is stored in the repository.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  native:
    name: native gem (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x86_64-linux, aarch64-linux, x86_64-darwin, arm64-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
          cargo-cache: true
          cache-version: v1-${{ matrix.platform }}
      - uses: oxidize-rb/actions/cross-gem@v1
        id: cross
        with:
          platform: ${{ matrix.platform }}
          ruby-versions: '3.4,4.0'
      - uses: actions/upload-artifact@v4
        with:
          name: gem-${{ matrix.platform }}
          path: ${{ steps.cross.outputs.gem-path }}
          if-no-files-found: error

  release:
    needs: native
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: bundle exec rake compile && bundle exec rspec
      - name: Tag the version
        id: tag
        run: |
          version=$(ruby -r ./lib/diverse_shuffle/version -e 'print DiverseShuffle::Engine::VERSION')
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, gem version $version"; exit 1; }
          else
            test "$GITHUB_REF_NAME" = main || { echo "release from main, not $GITHUB_REF_NAME"; exit 1; }
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a "v$version" -m "diverse_shuffle $version"
            git push origin "v$version"
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: gem-*
          path: pkg
          merge-multiple: true
      - name: Source gem
        run: gem build diverse_shuffle.gemspec --output "pkg/diverse_shuffle-${TAG#v}.gem"
        env:
          TAG: ${{ steps.tag.outputs.tag }}
      # Trusted publishing, with this repository's RubyGems owner asserted: a pending trusted publisher only lets the
      # first push create the gem when the exchange names the account that set it up (rickmark, id 81513).
      - name: RubyGems credentials
        env:
          RUBYGEMS_OWNER: '81513'
        run: |
          jwt=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rubygems.org" | jq -r .value)
          key=$(jq -n --arg jwt "$jwt" --arg owner "$RUBYGEMS_OWNER" '{jwt: $jwt, owner: $owner}' |
            curl -sS --fail-with-body -H 'Content-Type: application/json' --data @- \
              https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token | jq -r .rubygems_api_key)
          echo "::add-mask::$key"
          echo "GEM_HOST_API_KEY=$key" >> "$GITHUB_ENV"
      # The source gem goes first: a pending trusted publisher creates the gem on its first push.
      - name: Push the gems not yet on RubyGems
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version=${TAG#v}
          published=$(curl -sSf "https://rubygems.org/api/v1/versions/diverse_shuffle.json" 2>/dev/null || echo '[]')
          for gem in "pkg/diverse_shuffle-$version.gem" $(ls pkg/*.gem | grep -v "diverse_shuffle-$version.gem"); do
            platform=$(gem spec "$gem" platform)
            if echo "$published" | jq -e --arg v "$version" --arg p "$platform" \
                 'any(.[]; .number == $v and .platform == $p)' > /dev/null; then
              echo "$gem is already published"
            else
              gem push "$gem"
            fi
          done
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 && { echo "release $TAG exists"; exit 0; }
          ruby -e 'print File.read("CHANGELOG.md")[/^## #{ARGV[0].delete_prefix("v")} .*?(?=^## |\z)/m]' "$TAG" > notes.md
          gh release create "$TAG" pkg/*.gem --title "$TAG" --notes-file notes.md
